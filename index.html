<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakim Asif Arain Official Blog</title>
    <style>
        /* باہر کا تھیم تیز نیلا رنگ */
        body {
            background-color: #0077BE; /* Deep Blue / Sky Blue */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* اوپر والی ویلکم ہیڈنگ */
        .top-heading {
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        /* لکھائی اور ڈسکرپشن والا خانہ (ہلکا ہرا رنگ) */
        .content-box {
            background-color: #90EE90; /* Light Green */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* ڈسکرپشن کی لکھائی (کالا رنگ) */
        .description-text {
            color: #000000;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* About کا چھوٹا اور تیز ہرے رنگ کا بٹن (کالی لکھائی کے ساتھ) */
        .blog-button {
            display: inline-block;
            background-color: #00FF00; /* Bright/Fast Green */
            color: #000000; /* Black text */
            font-size: 16px;
            font-weight: bold;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .blog-button:hover {
            background-color: #00CC00;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- اوپر والی ہیڈنگ -->
    <h1 class="top-heading">Welcome to the official blog of Hakim Asif Arain</h1>

    <!-- لکھائی اور ڈسکرپشن والا حصہ (ہلکا ہرا) -->
    <div class="content-box">
        <p class="description-text">
            On this page, there are buttons to go to other places such as About Us, Disclaimer, Privacy Policy, Cognitive profile, and more.
        </p>

        <!-- صرف About کا بٹن -->
        <a href="https://hakimasifarainofficial.blogspot.com/p/about-us.html" target="_blank" class="blog-button">About</a>
    </div>


        <!-- Disclaimer کا بٹن -->
        <a href="https://hakimasifarainofficial.blogspot.com/p/disclaimer.html" target="_blank" class="blog-button" style="margin-top: 10px;">Disclaimer</a>



    
</body>
</html>
