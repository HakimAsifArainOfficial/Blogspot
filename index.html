<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakim Asif Arain Official Blog</title>
    <style>
        /* پورے صفحے کا آسمانی رنگ اور اوپر سے ترتیب */
        body {
            background-color: #87CEEB; /* Sky Blue */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ہیڈنگ کو بالکل اوپر کرنے کے لیے اسٹائل */
        .top-heading {
            color: #000000; /* Black */
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        /* لکھائی اور بٹنوں والا خانہ جو کہ ہرا ہوگا */
        .content-box {
            background-color: #2E8B57; /* Sea Green */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* خانے کے اندر کی لکھائی اور بٹن */
        .blog-button {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 25px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            width: 80%;
        }

        .blog-button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- یہ انگریزی والی ہیڈنگ اب بالکل اوپر نظر آئے گی -->
    <h1 class="top-heading">Welcome to the official blog of Hakim Asif Arain</h1>

    <!-- تمام بٹنوں والا ہرا خانہ -->
    <div class="content-box">
        <a href="https://hakimasifarainofficial.github.io/smart-hub/" target="_blank" class="blog-button">Smart Hub</a>
        
        <a href="https://hakimasifarainofficial.blogspot.com/p/about-us.html" target="_blank" class="blog-button">About Us</a>

        <!-- مستقبل میں مزید بٹن آپ یہاں نیچے شامل کر سکتے ہیں -->
    </div>

</body>
</html>
