<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حکیم آصف آرائیں آفیشل بلاگ</title>
    <style>
        /* پورے صفحے کا آسمانی رنگ */
        body {
            background-color: #87CEEB; /* Sky Blue */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* لکھائی اور بٹنوں والا حصہ جو کہ ہرا ہوگا */
        .content-box {
            background-color: #2E8B57; /* Sea Green */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* ہیڈنگ اور لکھائی کا رنگ کالا */
        h1 {
            color: #000000; /* Black */
            font-size: 26px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* بلاگ میں رکھے جانے والے بٹنوں کا اسٹائل */
        .blog-button {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 25px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            width: 80%;
        }

        .blog-button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="content-box">
        <!-- مطلوبہ ہیڈنگ -->
        <h1>حکیم آصف آرائیں آفیشل کے بلاگ میں آنے کا خوش آمدید</h1>

        <!-- یہاں آپ اپنے بلاگ کے تمام بٹن رکھ سکتے ہیں -->
        <a href="https://hakimasifarainofficial.github.io/smart-hub/" target="_blank" class="blog-button">Smart Hub</a>
        
        <a href="https://hakimasifarainofficial.blogspot.com/p/about-us.html" target="_blank" class="blog-button">About Us</a>

        <!-- مستقبل میں مزید بٹن آپ اس کے نیچے اسی طرح شامل کر سکتے ہیں -->
    </div>

</body>
</html>
